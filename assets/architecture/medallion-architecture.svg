<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura da solução de dados</title>
  <desc id="desc">Fluxo da origem dos dados até o usuário final, com Bronze, Silver, Gold, modelo semântico, ontologia e Data Agent.</desc>

  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box-label { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .main-box { stroke-width: 2.5; }
      .bronze { fill: #fff7ed; stroke: #c2410c; }
      .silver { fill: #eff6ff; stroke: #2563eb; }
      .gold { fill: #ecfdf5; stroke: #059669; }
      .semantic { fill: #f5f3ff; stroke: #7c3aed; }
      .ontology { fill: #fdf2f8; stroke: #db2777; }
      .agent { fill: #ecfeff; stroke: #0f766e; }
      .user { fill: #f8fafc; stroke: #475569; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .thin-arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowheadThin); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowheadThin" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="620" fill="#f8fafc"/>

  <text x="700" y="46" text-anchor="middle" class="title">Arquitetura da solução de dados</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">Bronze → Silver → Gold → Modelo semântico → Ontologia → Data Agent</text>

  <rect x="60" y="120" width="170" height="120" rx="16" class="main-box bronze"/>
  <text x="145" y="165" text-anchor="middle" class="box-label">Origem</text>
  <text x="145" y="192" text-anchor="middle" class="box-text">Arquivos CSV</text>
  <text x="145" y="212" text-anchor="middle" class="box-text">Dados brutos</text>

  <rect x="270" y="120" width="170" height="120" rx="16" class="main-box bronze"/>
  <text x="355" y="165" text-anchor="middle" class="box-label">Bronze</text>
  <text x="355" y="192" text-anchor="middle" class="box-text">Ingestão</text>
  <text x="355" y="212" text-anchor="middle" class="box-text">Rastreabilidade</text>

  <rect x="480" y="120" width="170" height="120" rx="16" class="main-box silver"/>
  <text x="565" y="165" text-anchor="middle" class="box-label">Silver</text>
  <text x="565" y="192" text-anchor="middle" class="box-text">Limpeza</text>
  <text x="565" y="212" text-anchor="middle" class="box-text">Padronização</text>

  <rect x="690" y="120" width="170" height="120" rx="16" class="main-box gold"/>
  <text x="775" y="165" text-anchor="middle" class="box-label">Gold</text>
  <text x="775" y="192" text-anchor="middle" class="box-text">Modelo analítico</text>
  <text x="775" y="212" text-anchor="middle" class="box-text">Dimensões + fato</text>

  <rect x="900" y="120" width="200" height="120" rx="16" class="main-box semantic"/>
  <text x="1000" y="165" text-anchor="middle" class="box-label">Modelo semântico</text>
  <text x="1000" y="192" text-anchor="middle" class="box-text">Estrutura para análise</text>
  <text x="1000" y="212" text-anchor="middle" class="box-text">Relatórios e consultas</text>

  <rect x="930" y="300" width="220" height="120" rx="16" class="main-box ontology"/>
  <text x="1040" y="345" text-anchor="middle" class="box-label">Ontologia</text>
  <text x="1040" y="372" text-anchor="middle" class="box-text">Derivada do modelo</text>
  <text x="1040" y="392" text-anchor="middle" class="box-text">Customer • Product • Date • Sales</text>

  <rect x="650" y="300" width="220" height="120" rx="16" class="main-box agent"/>
  <text x="760" y="345" text-anchor="middle" class="box-label">Data Agent</text>
  <text x="760" y="372" text-anchor="middle" class="box-text">Interação em linguagem natural</text>
  <text x="760" y="392" text-anchor="middle" class="box-text">Consulta de negócio</text>

  <rect x="150" y="470" width="1110" height="90" rx="18" class="main-box user"/>
  <text x="705" y="512" text-anchor="middle" class="box-label">Usuário final</text>
  <text x="705" y="534" text-anchor="middle" class="box-text">Consulta o negócio por meio do Data Agent, com apoio do modelo semântico e da ontologia</text>

  <path d="M230 180 H270" class="arrow"/>
  <path d="M440 180 H480" class="arrow"/>
  <path d="M650 180 H690" class="arrow"/>
  <path d="M860 180 H900" class="arrow"/>

  <path d="M1000 240 L1000 300" class="thin-arrow"/>
  <path d="M1000 420 L1000 470" class="thin-arrow"/>
  <path d="M930 360 H870" class="thin-arrow"/>
  <path d="M650 360 H610" class="thin-arrow"/>
  <path d="M760 420 L760 470" class="thin-arrow"/>
  <path d="M650 420 Q520 450 360 470" class="thin-arrow"/>
</svg>
